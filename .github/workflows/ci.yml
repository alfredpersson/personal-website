name: ci
on:
  push:
    branches: [main, astro-rebuild]
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private-content marker
        run: |
          # Regex uses + so this workflow file never contains the literal marker itself
          if grep -rqE 'visibility: +private' src public; then
            echo 'Found private-content marker in public site source'
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check internal links
        run: pnpm dlx linkinator ./dist --recurse --skip "^https?://(?!localhost|127\.0\.0\.1|0\.0\.0\.0)"
      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
